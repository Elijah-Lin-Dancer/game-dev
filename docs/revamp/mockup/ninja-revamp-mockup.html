<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>归途：星火之章 · UI 改造高保真原型稿</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#070a07; color:#e6efe6;
    font-family:'NinjaPixel','Fusion Pixel 12px',monospace;
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    image-rendering:pixelated;
  }
  .desk { display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px; }
  .screenbox {
    width:1280px; height:720px; position:relative; overflow:hidden;
    background:#101511; border:2px solid #2a3229; border-radius:6px;
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 0 0 1px #000;
  }
  .stage { width:640px; height:360px; position:relative; transform:scale(2); transform-origin:top left; overflow:hidden; }
  .desk-note { font-size:12px; color:#8fa0a8; letter-spacing:1px; }
  /* ---------- 背景层级 L0/L1/暗角 ---------- */
  .bg-tile { position:absolute; inset:0; background-repeat:repeat; opacity:.35; }
  .bg-veil { position:absolute; inset:0; background:rgba(0,0,0,.42); }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .screen { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity 120ms cubic-bezier(.2,.7,.3,1); }
  .screen.on { opacity:1; pointer-events:auto; }
  /* ---------- 字号阶梯 ---------- */
  .t-display { font-size:24px; line-height:30px; }
  .t-title { font-size:16px; line-height:22px; font-weight:bold; }
  .t-body { font-size:12px; line-height:16px; }
  .t-cap { font-size:10px; line-height:14px; opacity:.75; }
  .t-micro { font-size:8px; line-height:10px; }
  /* ---------- 通用组件 ---------- */
  .panel { background-color:#1b211d; border:2px solid transparent; }
  .slot { background-color:#141a16; border:1px solid #2a3229; display:flex; align-items:center; justify-content:center; }
  .btn {
    height:24px; min-width:64px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; line-height:16px; color:#e6efe6; border:2px solid transparent; cursor:pointer;
    user-select:none;
  }
  .btn.on { color:#ffe9b0; }
  .btn.disabled { color:#8a938a; cursor:not-allowed; }
  .bar { height:6px; background:#161a17; border:1px solid #2a3229; position:relative; overflow:hidden; }
  .bar > i { display:block; height:100%; background:#7ec96a; }
  .ribbon { display:inline-flex; align-items:center; height:16px; padding:0 8px; font-size:10px; color:#fff; }
  .icon-img { image-rendering:pixelated; }
  .lock-badge { position:absolute; right:6px; top:6px; width:14px; height:14px; }
  /* 页脚常驻 */
  #depthbar { position:absolute; left:0; right:0; bottom:0; height:22px; line-height:22px;
    font-size:12px; color:#c8d8c0; opacity:.75; padding:0 16px; display:flex; justify-content:space-between;
    background:rgba(10,14,10,.7); border-top:1px solid #2a3229; z-index:40; }
  /* 覆盖层 */
  .mask { position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:center; justify-content:center; }
  .overlay-panel { position:relative; z-index:51; }
  .toast { position:absolute; left:50%; bottom:34px; transform:translateX(-50%); z-index:60;
    background:rgba(10,14,10,.9); border:1px solid #5f7a52; color:#e6efe6; font-size:12px; padding:6px 12px; }
  /* 标题菜单 */
  .menu-item { width:240px; height:32px; display:flex; align-items:center; padding:0 16px; gap:10px;
    font-size:12px; color:#e6efe6; background:#1b211d; border:2px solid #39423a; cursor:pointer;
    transition:all 120ms cubic-bezier(.2,.7,.3,1); }
  .menu-item:hover { background:#22301e; border-color:#5f7a52; transform:translateY(-2px); color:#fff; }
  .menu-item.sel { background:#1f2a20; border:3px solid #ffe9b0; color:#fff;
    box-shadow:0 0 10px rgba(255,212,121,.35); transform:translateY(-2px); }
</style>
</head>
<body>
<div class="desk">
  <div class="screenbox">
    <div class="stage" id="stage">
      <div class="bg-tile" id="bgTile"></div>
      <div class="bg-veil"></div>
      <div class="vignette"></div>
      <section class="screen" id="scr-title"></section>
      <section class="screen" id="scr-map"></section>
      <section class="screen" id="scr-stages"></section>
      <section class="screen" id="scr-hall"></section>
      <div id="overlay-root"></div>
      <div class="toast" id="toast" style="display:none"></div>
      <div id="depthbar"><span id="depthLeft"></span><span id="depthRight"></span></div>
    </div>
  </div>
  <div class="desk-note">640×360 逻辑分辨率 / 2× 显示 · 离线单文件原型 · 方向键移动 · Enter 确认 · ESC 返回</div>
</div>

/* ================= 导航状态机（u08 §4） ================= */
const NAV = {
  stack: ['title'],
  overlay: null,
  state: { chapter:0, stage:0, tier:'normal', hallTab:'weapons', mapTab:'main', wPage:0, cPage:0, selW:0, selC:0 },
};
const REGISTRY = { title:null, map:'title', stages:'map', hall:'map' };

function currentNode(){ return NAV.stack[NAV.stack.length-1]; }
function go(node, args){
  if(args) Object.assign(NAV.state, args);
  NAV.stack.push(node); NAV.overlay = null;
  enterNode();
}
function back(){
  if(NAV.overlay){ closeOverlay(); return; }
  if(NAV.stack.length > 1){ NAV.stack.pop(); }
  enterNode();
}
function enterNode(){
  const n = currentNode();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-' + n).classList.add('on');
  SCREENS[n].render();
  renderDepth();
}
function renderDepth(){
  const d = NAV.stack.length - 1;
  document.getElementById('depthLeft').textContent =
    d === 0 ? 'depth 0 · 根目录' : `depth ${d} · ESC 返回`;
  document.getElementById('depthRight').textContent = '↑↓←→ 选择 · Enter 确认 · ESC 返回';
}

/* ================= 小工具 ================= */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function img(asset, w, h){ const i=document.createElement('img'); i.src=asset; i.className='icon-img'; i.width=w; i.height=h; return i; }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',1400);
}
function starsHtml(n, max){
  let s=''; for(let i=0;i<3;i++) s += i<n ? '★' : '☆';
  return `<span style="color:#ffd479">${s}</span>`;
}
function esc(s){ return String(s).replace(/</g,'&lt;'); }

SCREENS.title = {
  focus: 0, focusCols: 1,
  render(){
    const scr = document.getElementById('scr-title'); scr.innerHTML='';
    const wrap = el('div',''); wrap.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:28px;';
    const title = el('div','t-display','归途');
    title.style.cssText='color:#ffe9b0;letter-spacing:6px;text-shadow:0 3px 0 rgba(0,0,0,.5);';
    const sub = el('div','t-cap','星火之章 · 多角色动作 Roguelike');
    sub.style.marginTop='8px';
    wrap.appendChild(title); wrap.appendChild(sub);
    const menu = el('div',''); menu.style.cssText='margin-top:18px;display:flex;flex-direction:column;gap:10px;';
    TITLE_MENU.forEach((m,i)=>{
      const b=el('div','menu-item'+(i===this.focus?' sel':''));
      b.dataset.focus=i; b.dataset.action=m.id;
      b.innerHTML=`<span style="color:#ffd479">▸</span><span style="flex:1">${m.label}</span><span class="t-cap" style="color:#8fa0a8">${m.hint}</span>`;
      b.onclick=()=>this.activate(i);
      menu.appendChild(b);
    });
    wrap.appendChild(menu);
    const ver=el('div','t-micro','build 12B · 改造原型稿'); ver.style.cssText='position:absolute;bottom:30px;color:#8fa0a8;';
    wrap.appendChild(ver);
    scr.appendChild(wrap);
  },
  activate(i){
    const m=TITLE_MENU[i].id;
    if(m==='continue'||m==='new') go('map');
    else if(m==='hall') go('hall');
    else if(m==='settings') openOverlay('settings');
    else if(m==='credits') openOverlay('credits');
  },
  key(k){
    if(k==='ArrowUp'){ this.focus=(this.focus+TITLE_MENU.length-1)%TITLE_MENU.length; SCREENS.title.render(); }
    if(k==='ArrowDown'){ this.focus=(this.focus+1)%TITLE_MENU.length; SCREENS.title.render(); }
    if(k==='Enter') this.activate(this.focus);
  }
};

    for(let i=0;i<ch.stages;i++){

      let icon=null,color='#39423a',typeLabel='普通',boss=false,elite=false;

      else if(t==='rest'){ typeLabel='篝火'; icon=A.campfire; }
      else if(t==='shrine'){ typeLabel='石龛'; icon=A.upgPower; }

        mobs, reward:this.rewardFor(t,isBoss,false) });

    if(b==='spirit') return A.headSpirit;
    if(b==='flam') return A.headFlam;
    if(b==='weaver') return A.headWeaver;
    return A.headFrog;
  },

      const rarDot=`<span style="color:${r.c}">●</span> ${r.n}`;
      info.innerHTML=`<div class="t-body" style="font-weight:bold">${esc(w.name)}</div>
        <div class="t-cap" style="color:#8fa0a8">${KIND_NAME[w.kind]||w.kind} · ${rarDot}</div>`;
      row.appendChild(info); card.appendChild(row);
      const stat=el('div','t-micro',`攻 ${w.dmgMul.toFixed(1)} · 速 ${w.cd}ms ${w.reach?('· 程 '+w.reach):'· 远程'}${w.pierce?(' · 穿 '+w.pierce):''}`);
      stat.style.color='#a9bcae'; card.appendChild(stat);
      const status=el('div','t-body ellipsis'); status.style.minWidth='0';
      if(w.locked){ status.style.color='#ffb0a0'; status.textContent='未解锁 · '+(w.x?w.x.sourceDesc:w.sourceDesc); }
      else { status.style.color='#9fe0ff'; status.textContent='已进掉落池'; }
      card.appendChild(status);
      card.dataset.focus=rx;
      card.onclick=()=>{ st.selW=rx; this.focus=rx; this.render(); };
      grid.appendChild(card);
    });
    scr.appendChild(grid);
    this.renderWeaponDetail(scr, list[st.selW]);
  },
  renderWeaponDetail(scr, w){
    if(!w) return;
    const r=RARITY[w.x?w.x.rarity:w.rarity]||RARITY.common;
    const panel=el('div','panel'); panel.style.cssText='position:absolute;left:380px;top:62px;width:244px;bottom:28px;padding:16px;display:flex;flex-direction:column;gap:10px;';
    const top=el('div',''); top.style.cssText='display:flex;gap:12px;';
    const slot=el('div','slot'); slot.style.cssText='width:48px;height:48px;flex:none;';
    if(w.icon&&A[w.icon]) slot.appendChild(img(A[w.icon], w.icon==='wBow'?30:24, w.icon==='wBow'?14:32));
    top.appendChild(slot);
    const meta=el('div',''); meta.style.flex='1';
    meta.innerHTML=`<div class="t-title">${esc(w.name)}</div>
      <div class="ribbon" style="background:${r.b};margin-top:4px">${r.n} · ${KIND_NAME[w.kind]||w.kind}</div>`;
    top.appendChild(meta); panel.appendChild(top);
    const rows=[['伤害',w.dmgMul.toFixed(1)],['攻速',w.cd+' ms'],['射程',w.reach?w.reach+' px':'远程'],['穿透',w.pierce||0],['击退',w.knock||0]];
    const list=el('div',''); list.style.cssText='display:flex;flex-direction:column;gap:6px;';
    rows.forEach(([k,v])=>{
      const row=el('div','t-body'); row.style.cssText='display:flex;justify-content:space-between;';
      row.innerHTML=`<span style="color:#a9bcae">${k}</span><span style="color:#ffd479">${v}</span>`;
      list.appendChild(row);
    });
    panel.appendChild(list);
    const desc=el('div','t-cap',esc(w.x?w.x.desc:w.desc||'—')); desc.style.cssText='color:#d8e6da;'; panel.appendChild(desc);
    const src=el('div','t-body',w.locked?('获取：'+(w.x?w.x.sourceDesc:w.sourceDesc)):'获取：已进入掉落池');
    src.style.color=w.locked?'#ffb0a0':'#9fe0ff'; panel.appendChild(src);
    const btn=el('div','btn'+(w.locked?' disabled':'on'));
    btn.textContent=w.locked?(w.x&&w.x.need?`解锁 ${w.x.need} 宝石`:'未解锁'):'已进掉落池';
    btn.style.cssText+='margin-top:auto;min-width:96px;height:24px;align-self:flex-start;';
    btn.onclick=()=>toast(w.locked?'原型稿：解锁动作见改造方案 §6 内容经济':'该武器已在掉落池中');
    panel.appendChild(btn);
    scr.appendChild(panel);
  },

  /* ---------- 角色 ---------- */
  charList(){
    const real=DATA.chars.map((c,i)=>({ ...c, locked:MOCK.charState[i]==='locked',
      unlockDesc:(CHAR_X[c.id]&&CHAR_X[c.id].unlockDesc)||c.unlockDesc }));
    return real.concat(CHAR_LOCKED.map(c=>({ ...c, locked:true, placeholder:true })));
  },
  renderChars(scr){
    const st=NAV.state, list=this.charList();
    const per=6, pages=Math.ceil(list.length/per);
    st.cPage=Math.min(st.cPage,pages-1);
    const page=list.slice(st.cPage*per, st.cPage*per+per);
    const bar=el('div',''); bar.style.cssText='position:absolute;left:16px;top:54px;width:352px;height:22px;display:flex;align-items:center;';
    const pager=el('div',''); pager.style.cssText='margin-left:auto;display:flex;gap:6px;align-items:center;';
    const prev=el('div','btn'); prev.textContent='◀'; prev.style.cssText='width:28px;height:22px;min-width:0;'; prev.onclick=()=>{ st.cPage=(st.cPage+pages-1)%pages; this.render(); };
    const pg=el('div','t-micro',`${st.cPage+1}/${pages}`);
    const next=el('div','btn'); next.textContent='▶'; next.style.cssText='width:28px;height:22px;min-width:0;'; next.onclick=()=>{ st.cPage=(st.cPage+1+pages)%pages; this.render(); };
    pager.appendChild(prev); pager.appendChild(pg); pager.appendChild(next); bar.appendChild(pager); scr.appendChild(bar);

    const grid=el('div',''); grid.style.cssText='position:absolute;left:16px;top:82px;width:352px;bottom:28px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:6px;';
    page.forEach((c,i)=>{
      const rx=st.cPage*per+i;
      const card=el('div','panel card'+(c.locked?' lock':'')+(rx===st.selC?' sel':''));
      card.style.cssText+='position:relative;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:'+(c.locked?'default':'pointer');
      const row=el('div',''); row.style.cssText='display:flex;gap:8px;';
      const slot=el('div','slot'); slot.style.cssText='width:28px;height:28px;flex:none;';
      const walk=c.skin==='mage'?A.walkMage:c.skin==='knight'?A.walkKnight:A.walk;
      if(!c.locked) slot.appendChild(img(walk,16,16)); else slot.appendChild(el('div','t-cap','?'));
      row.appendChild(slot);
      const info=el('div',''); info.style.cssText='flex:1;min-width:0;';
      info.innerHTML=`<div class="t-body" style="font-weight:bold">${esc(c.name)}</div>
        <div class="t-cap" style="color:#ffd479">${esc(c.tag)}</div>`;
      row.appendChild(info); card.appendChild(row);
      const stat=el('div','t-micro',`HP ${c.hp} · 攻 ${c.dmg} · 速 ${c.speed}`); stat.style.color='#a9bcae';
      card.appendChild(stat);
      const status=el('div','t-body ellipsis'); status.style.minWidth='0';
      if(c.locked){ status.style.color='#ffb0a0'; status.textContent='锁 · '+c.unlockDesc; }
      else { status.style.color='#9fe0ff'; status.textContent='初始武器 · '+(this.weaponName(c.weapon)); }
      card.appendChild(status);
      card.dataset.focus=rx;
      card.onclick=()=>{ st.selC=rx; this.focus=rx; this.render(); };
      grid.appendChild(card);
    });
    scr.appendChild(grid);
    this.renderCharDetail(scr, list[st.selC]);
  },
  weaponName(id){ const w=DATA.weapons.find(x=>x.id===id); return w?w.name:id; },
  renderCharDetail(scr, c){
    if(!c) return;
    const panel=el('div','panel'); panel.style.cssText='position:absolute;left:380px;top:62px;width:244px;bottom:24px;padding:16px;display:flex;flex-direction:column;gap:10px;';
    const top=el('div',''); top.style.cssText='display:flex;gap:12px;';
    const slot=el('div','slot'); slot.style.cssText='width:48px;height:48px;flex:none;';
    const face=c.face?A[c.face]:null;
    if(!c.locked&&face) slot.appendChild(img(face,38,38));
    top.appendChild(slot);
    const meta=el('div',''); meta.style.flex='1';
    meta.innerHTML=`<div class="t-title">${esc(c.name)}</div><div class="t-cap" style="color:#ffd479;margin-top:4px">${esc(c.tag)}</div>`;
    top.appendChild(meta); panel.appendChild(top);
    const max={hp:28,dmg:5,speed:100};
    const bars=[['HP',c.hp,max.hp],['攻击',c.dmg,max.dmg],['速度',c.speed,max.speed]];
    const bl=el('div',''); bl.style.cssText='display:flex;flex-direction:column;gap:6px;';
    bars.forEach(([k,v,m])=>{
      const row=el('div',''); row.style.cssText='display:flex;align-items:center;gap:8px;';
      row.innerHTML=`<span class="t-cap" style="width:32px;color:#a9bcae">${k}</span>
        <div class="bar" style="flex:1"><i style="width:${Math.round(v/m*100)}%"></i></div>
        <span class="t-body" style="width:24px;text-align:right;color:#e6efe6">${v}</span>`;
      bl.appendChild(row);
    });
    panel.appendChild(bl);
    const sk=el('div',''); sk.style.cssText='display:flex;flex-direction:column;gap:4px;';
    sk.innerHTML=`<div class="t-body" style="color:#9fe0ff">【${esc(c.skill.name)}】</div>
      <div class="t-cap" style="color:#d8e8d0">${esc(c.skill.desc)} · 冷却 ${c.skill.cd/1000}s</div>`;
    panel.appendChild(sk);
    const eq=el('div',''); eq.style.cssText='display:flex;gap:8px;align-items:center;';
    eq.innerHTML=`<span class="t-cap" style="color:#a9bcae">初始</span>`;
    const wslot=el('div','slot'); wslot.style.cssText='width:24px;height:24px;';
    const w=DATA.weapons.find(x=>x.id===c.weapon);
    if(w&&A[w.icon]) wslot.appendChild(img(A[w.icon],12,12));
    eq.appendChild(wslot);
    ['符文','饰品'].forEach(n=>{
      const s=el('div','slot'); s.style.cssText='width:32px;height:32px;margin-left:auto;';
      s.appendChild(el('div','t-micro',n)); eq.appendChild(s);
    });
    panel.appendChild(eq);
    const btn=el('div','btn'+(c.locked?' disabled':'on'));
    btn.textContent=c.locked?('解锁 · '+c.unlockDesc):'设为出战';
    btn.style.cssText+='margin-top:auto;min-width:96px;height:24px;align-self:flex-start;';
    btn.onclick=()=>toast(c.locked?'原型稿：解锁条件见改造方案 §6':'出战选择在选人层确认');
    panel.appendChild(btn);
    scr.appendChild(panel);
  },
  renderCodex(scr){
    const p=el('div','panel'); p.style.cssText='position:absolute;left:16px;right:16px;top:62px;bottom:30px;padding:16px;';
    p.innerHTML=`<div class="t-title">图鉴</div><div class="t-cap" style="margin-top:8px;color:#a9bcae">怪物 / Boss / 武器 / 房间点亮记录 —— 只读长列表，原型稿暂不展开，见改造方案 §5。</div>`;
    scr.appendChild(p);
  },
  key(k){
    const list=NAV.state.hallTab==='weapons'?this.weaponList():this.charList();
    const cols=2;
    if(k==='ArrowLeft') this.focus=(this.focus+cols-1)%cols;
    if(k==='ArrowRight') this.focus=(this.focus+1)%cols;
    if(k==='ArrowUp') this.focus=Math.max(0,this.focus-cols);
    if(k==='ArrowDown') this.focus=Math.min(list.length-1,this.focus+cols);
    if(k==='Enter'){ if(NAV.state.hallTab==='weapons'){NAV.state.selW=this.focus;}else{NAV.state.selC=this.focus;} }
    SCREENS.hall.render();
  }
};

/* ================= 覆盖层（设置 / 制作名单） ================= */
function openOverlay(kind){
  NAV.overlay=kind;
  const root=document.getElementById('overlay-root'); root.innerHTML='';
  const mask=el('div','mask'); mask.dataset.action='mask';
  mask.onclick=()=>closeOverlay();
  const panel=el('div','overlay-panel panel');
  if(kind==='credits'){
    panel.style.cssText='width:560px;padding:20px;';
    const box=el('div',''); box.style.cssText='display:flex;justify-content:center;margin-bottom:14px;position:relative;';
    const db=img(A.dialogBox,300,58); db.style.filter='brightness(.55)'; box.appendChild(db);
    const title=el('div','t-title','制作名单'); title.style.cssText='position:absolute;top:18px;width:100%;text-align:center;color:#ffe9b0;';
    box.appendChild(title);
    panel.appendChild(box);
    const lines=['制作 · Elijah-Lin-Dancer','美术 · Ninja Adventure（CC0）','特效 · pixelfx（MIT）','字体 · Fusion Pixel 12px（OFL）','音频 · Ninja Adventure / 公开音源','素材清单见仓库 assets/CREDITS.md'];
    lines.forEach((ln,i)=>{ const d=el('div','t-body',esc(ln)); d.style.cssText='text-align:center;margin:6px 0;color:#e6efe6;'+(i===0?'color:#fff;font-weight:bold':''); panel.appendChild(d); });
    const close=el('div','btn on','关闭 ✕'); close.style.cssText='margin:14px auto 0;display:flex;';
    close.onclick=()=>closeOverlay(); panel.appendChild(close);
  } else {
    panel.style.cssText='width:420px;padding:20px;';
    panel.innerHTML=`<div class="t-title" style="color:#ffe9b0;margin-bottom:12px">设置</div>`;
    [['音乐','开'],['音效','开'],['屏幕震动','关']].forEach(([k,v])=>{
      const row=el('div','t-body'); row.style.cssText='display:flex;justify-content:space-between;margin:8px 0;';
      row.innerHTML=`<span>${k}</span><span style="color:#9fe0ff">${v}</span>`; panel.appendChild(row);
    });
    const note=el('div','t-cap','注：原全局「难度」开关已废除，难度改为按章节解锁（普通 / 噩梦 / 地狱），见地图章节页。');
    note.style.cssText='margin-top:10px;color:#ffb0a0;'; panel.appendChild(note);
    const close=el('div','btn on','返回'); close.style.cssText='margin-top:14px;';
    close.onclick=()=>closeOverlay(); panel.appendChild(close);
  }
  mask.appendChild(panel); root.appendChild(mask);
}
function closeOverlay(){ NAV.overlay=null; document.getElementById('overlay-root').innerHTML=''; }

/* ================= 全局输入 ================= */
document.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape'].includes(e.key)) e.preventDefault();
  if(e.key==='Escape'){ back(); return; }
  const n=currentNode();
  if(NAV.overlay) return;
  if(SCREENS[n]) SCREENS[n].key(e.key);
});
document.addEventListener('contextmenu', e=>{ e.preventDefault(); back(); });

/* 资产 CSS 注入（九宫格 / 凹槽底图） */
(function injectCss(){
  const s=document.createElement('style');
  s.textContent=`
    @font-face{font-family:'NinjaPixel';src:url(${FONT_URI}) format('woff2');}
    .panel{border:2px solid transparent;border-image:url(${A.panelGreen}) 2 / 2px;background-color:#1b211d;}
    .slot{background-color:#141a16;background-image:url(${A.slotBg});background-size:16px 16px;}
    .btn{border:2px solid transparent;border-image:url(${A.btnNormal}) 2 / 2px 8px;}
    .btn:hover{border-image:url(${A.btnHover}) 2 / 2px 8px;}
    .btn.on{border-image:url(${A.btnPressed}) 2 / 2px 8px;}
    .btn.disabled{border-image:url(${A.btnDisabled}) 2 / 2px 8px;}
    .ribbon{background-image:url(${A.choiceBox});background-size:64px 20px;}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  `;
  document.head.appendChild(s);
  document.getElementById('bgTile').style.backgroundImage=`url(${A.tileFloor})`;
})();

/* 启动 */
enterNode();
window.__mock={ go, back, NAV, openOverlay, closeOverlay, SCREENS };
</script>
